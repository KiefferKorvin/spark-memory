<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG-QA Arena Live</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e3de;
  --win: #2f8a4e; --tie: #b5b3aa; --loss: #c8483d; --accent: #3b5bdb; --run: #d98e04; --kg: #7048e8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a998f; --line: #34332f;
    --win: #4fb573; --tie: #6f6e67; --loss: #e0685c; --accent: #7c96ff; --run: #f0b43c; --kg: #9d7dff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 18px; margin: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.pill { padding: 2px 10px; border-radius: 99px; background: var(--line); font-size: 12px; font-weight: 600; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tie); }
.dot.on { background: var(--win); animation: pulse 1.5s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.stage b { font-size: 20px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; display: flex; }
.bar i { display: block; height: 100%; }
.muted { color: var(--muted); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; }
.stack { display: flex; height: 14px; border-radius: 3px; overflow: hidden; min-width: 120px; background: var(--line); }
.method { font-weight: 600; white-space: nowrap; }
.kg { color: var(--kg); }
.chip { display: inline-block; min-width: 22px; text-align: center; border-radius: 4px; padding: 1px 5px; font-size: 11px; font-weight: 700; color: #fff; }
.W { background: var(--win); } .T { background: var(--tie); } .L { background: var(--loss); }
.R { background: var(--run); animation: pulse 1.2s infinite; } .A { background: var(--accent); } .P { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.filters button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; }
.filters button.on { background: var(--ink); color: var(--bg); }
tr.q { cursor: pointer; } tr.q:hover td { background: color-mix(in srgb, var(--line) 35%, transparent); }
tr.q:focus-visible td { outline: 2px solid var(--accent); }
.detail td { background: var(--bg); padding: 12px; }
.answers { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.ans { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.ans h3 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ans p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.judge { margin-top: 8px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.judge ul { margin: 4px 0 0; padding-left: 18px; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.log { font: 12px/1.5 ui-monospace, Consolas, monospace; max-height: 260px; overflow: auto; white-space: pre-wrap; margin: 0; }
.err { color: var(--loss); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
</style>
</head>
<body>
<main>
  <header>
    <h1>RAG-QA Arena · <span id="run"></span></h1>
    <span class="pill" id="phase">loading</span>
    <span class="live"><span class="dot" id="dot"></span><span id="ago"></span></span>
    <span class="muted" id="config"></span>
  </header>
  <div class="grid" id="stages"></div>
  <section class="card" style="margin-bottom:16px">
    <h2>Leaderboard: each method against the LFRQA reference answers</h2>
    <div class="scroll"><table id="board"></table></div>
    <div class="legend"><span style="--c:var(--win)">method wins</span><span style="--c:var(--tie)">tie</span><span style="--c:var(--loss)">LFRQA wins</span></div>
  </section>
  <section class="card" style="margin-bottom:16px">
    <h2>Win + tie rate by domain</h2>
    <div class="scroll"><table id="domains"></table></div>
  </section>
  <section class="card" style="margin-bottom:16px">
    <h2>Questions</h2>
    <div class="filters" id="filters"></div>
    <div class="scroll"><table id="questions"></table></div>
  </section>
  <section class="card">
    <h2>Log</h2>
    <pre class="log" id="log"></pre>
  </section>
</main>
<script>
const METHODS = ["closed_book", "bm25_rag", "dense_rag", "oracle_rag", "kg_memory", "kg_context"];
const LABELS = {closed_book: "Closed book", bm25_rag: "BM25 RAG", dense_rag: "Dense RAG", oracle_rag: "Oracle RAG (gold docs)", kg_memory: "KG memory", kg_context: "KG context (arena template)"};
const run = new URLSearchParams(location.search).get("run") || "preview";
const open = new Set();
let state = null, lastUpdated = null, domainFilter = "all";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = (a, b) => b ? (100 * a / b).toFixed(0) + "%" : "–";
const money = x => "$" + (x || 0).toFixed(x >= 1 ? 2 : 4);
const dur = s => s < 90 ? s.toFixed(0) + "s" : s < 5400 ? (s / 60).toFixed(0) + " min" : (s / 3600).toFixed(1) + " h";
const label = m => `<span class="method ${m.startsWith("kg_") ? "kg" : ""}">${esc(LABELS[m] || m)}</span>`;
const mean = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const words = s => (s || "").split(/\s+/).filter(Boolean).length;

function verdict(j) { return !j ? null : j.winner === "tie" ? "T" : j.winner === "LFRQA" ? "L" : "W"; }

function index(s) {
  const ans = {}, jud = {}, gr = {};
  for (const a of s.answers) ans[a.method + "|" + a.qid] = a;
  for (const j of s.judgments) jud[j.method + "|" + j.qid] = j;
  for (const g of s.grounding || []) gr[g.method + "|" + g.qid] = g;
  const methods = METHODS.filter(m => s.config.methods ? s.config.methods.includes(m) : true);
  return {ans, jud, gr, methods};
}

function stages(s, {methods}) {
  const q = s.questions.length, total = q * methods.length, p = s.progress.ingest || {};
  const done = new Set(s.ingested.filter(r => !r.error).map(r => r.doc_id));
  const ok = done.size, failed = new Set(s.ingested.filter(r => r.error && !done.has(r.doc_id)).map(r => r.doc_id)).size;  // a retried success is not a failure
  const docs = s.corpus.documents || p.total || 0;
  const elapsed = p.started ? ((p.finished || s.updated) - p.started) : 0;
  const rate = ok && elapsed ? elapsed / ok : null;
  const eta = rate && !p.finished && docs > ok ? ` · ETA ${dur(rate * (docs - ok) )}` : "";
  const domains = Object.entries(s.corpus.by_domain || {}).map(([d, n]) => `${d} ${n}`).join(" · ");
  const card = (title, done, of, sub, color = "var(--accent)") => `<div class="card stage"><h2>${title}</h2>
    <b>${done}</b> <span class="muted">/ ${of}</span><div class="bar"><i style="width:${of ? 100 * done / of : 0}%;background:${color}"></i></div>
    <div class="muted">${sub}</div></div>`;
  const running = methods.flatMap(m => (s.running[m] || []).map(qid => m)).length;
  const mapped = s.ingested.filter(r => r.extracted != null), skips = {};
  mapped.forEach(r => Object.entries(r.skips || {}).forEach(([k, n]) => skips[k] = (skips[k] || 0) + n));
  const extracted = mapped.reduce((t, r) => t + r.extracted, 0), skipped = Object.values(skips).reduce((t, n) => t + n, 0);
  const provisional = mapped.reduce((t, r) => t + (r.provisional || 0), 0);
  const mapping = mapped.length ? card("Concept mapping", extracted - skipped, extracted,
    [`linked${provisional ? `, ${provisional} provisional` : ""}`, ...Object.entries(skips).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(k)} ${n}`)].join(" · "), "var(--kg)") : "";
  return card("1 · Subset", q, q, `${docs} documents (${s.corpus.gold ?? "–"} gold) · ${domains || "preparing"}`) +
    card("2 · KG ingestion", ok, docs, `${failed ? `<span class="err">${failed} failed</span> · ` : ""}${rate ? rate.toFixed(1) + " s/doc wall" : ""}${eta}${p.cost != null ? " · " + money(p.cost) + ` · ${p.calls} calls` : ""}`, "var(--kg)") + mapping +
    card("3 · Answers", s.answers.length, total, `${running} in flight`) +
    card("4 · Judged vs LFRQA", s.judgments.length, total, `judge ${esc(s.config.judge || "")}`, "var(--win)");
}

function board(s, {ans, jud, methods}) {
  const inDomain = r => domainFilter === "all" || s.questions.find(q => q.qid === r.qid)?.domain === domainFilter;
  const rows = methods.map(m => {
    const js = s.judgments.filter(j => j.method === m && inDomain(j));
    const supported = mean((s.grounding || []).filter(g => g.method === m && g.supported != null && inDomain(g)).map(g => g.supported));
    const c = {W: 0, T: 0, L: 0}; js.forEach(j => c[verdict(j)]++);
    const as = s.answers.filter(a => a.method === m);
    const recall = mean(as.filter(a => a.gold_recall != null).map(a => a.gold_recall));
    const cost = as.reduce((t, a) => t + (a.cost || 0), 0);
    const errors = as.filter(a => a.error).length;
    return {m, c, n: js.length, recall, supported, cost, errors, words: mean(as.map(a => words(a.pred))), secs: mean(as.map(a => a.seconds || 0))};
  }).sort((a, b) => (b.n ? (b.c.W + b.c.T) / b.n : -1) - (a.n ? (a.c.W + a.c.T) / a.n : -1));
  const refWords = mean(s.questions.map(q => words(q.reference)));
  return `<tr><th>Method</th><th class="num">Win</th><th class="num">Win+tie</th><th>Win · tie · loss</th><th class="num">Judged</th>
    <th class="num">Gold recall</th><th class="num" title="Mean share of answer claims supported by the passages the method used">Supported</th><th class="num">Avg words</th><th class="num">Avg s</th><th class="num">Answer cost</th><th class="num">Errors</th></tr>` +
    rows.map(r => `<tr><td>${label(r.m)}</td><td class="num">${pct(r.c.W, r.n)}</td><td class="num"><b>${pct(r.c.W + r.c.T, r.n)}</b></td>
      <td><div class="stack">${["W", "T", "L"].map(k => `<i class="${k}" style="width:${r.n ? 100 * r.c[k] / r.n : 0}%" title="${k} ${r.c[k]}"></i>`).join("")}</div></td>
      <td class="num">${r.n}</td><td class="num">${r.recall == null ? "–" : (100 * r.recall).toFixed(0) + "%"}</td>
      <td class="num">${r.supported == null ? "–" : (100 * r.supported).toFixed(0) + "%"}</td>
      <td class="num">${r.words == null ? "–" : r.words.toFixed(0)}</td><td class="num">${r.secs == null ? "–" : r.secs.toFixed(1)}</td>
      <td class="num">${money(r.cost)}</td><td class="num ${r.errors ? "err" : ""}">${r.errors}</td></tr>`).join("") +
    `<tr><td class="muted">LFRQA reference</td><td colspan="6"></td><td class="num muted">${refWords == null ? "–" : refWords.toFixed(0)}</td><td colspan="3"></td></tr>`;
}

function domains(s, {jud, methods}) {
  const ds = [...new Set(s.questions.map(q => q.domain))];
  return `<tr><th>Method</th>${ds.map(d => `<th class="num">${esc(d)}</th>`).join("")}</tr>` + methods.map(m => `<tr><td>${label(m)}</td>${ds.map(d => {
    const js = s.questions.filter(q => q.domain === d).map(q => jud[m + "|" + q.qid]).filter(Boolean);
    const good = js.filter(j => verdict(j) !== "L").length;
    return `<td class="num">${pct(good, js.length)} <span class="muted">(${js.length})</span></td>`;
  }).join("")}</tr>`).join("");
}

function cell(s, m, q, {ans, jud}) {
  const j = jud[m + "|" + q.qid], a = ans[m + "|" + q.qid];
  if (j) return `<span class="chip ${verdict(j)}" title="${esc(LABELS[m])}: ${esc(j.winner)}">${verdict(j)}</span>`;
  if (a) return `<span class="chip A" title="answered, awaiting judge">…</span>`;
  if ((s.running[m] || []).includes(q.qid)) return `<span class="chip R" title="running">●</span>`;
  return `<span class="chip P">·</span>`;
}

function detail(s, q, {ans, jud, gr, methods}) {
  const blocks = methods.map(m => {
    const a = ans[m + "|" + q.qid], j = jud[m + "|" + q.qid], g = gr[m + "|" + q.qid];
    if (!a) return `<div class="ans"><h3>${label(m)} <span class="tag">pending</span></h3></div>`;
    const tags = [a.gold_recall != null ? `gold recall ${(100 * a.gold_recall).toFixed(0)}%` : null, `${a.seconds}s`, a.cost ? money(a.cost) : null,
      a.coverage ? `coverage ${a.coverage}` : null, a.nodes_explored != null ? `${a.nodes_explored} nodes` : null,
      a.calls ? `${a.calls} calls` : null, a.fallback ? "synthesis fallback" : null,
      g && g.supported != null ? `supported ${(100 * g.supported).toFixed(0)}%` : null].filter(Boolean);
    const unsupported = g && g.unsupported && g.unsupported.length ? `<div class="judge">Unsupported by its passages:<ul>${g.unsupported.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : "";
    const retrieved = a.retrieved ? `<div class="muted">retrieved: ${a.retrieved.map(d => q.gold.includes(d) ? `<b>${esc(d)}</b>` : esc(d)).join(", ") || "none"}</div>` : "";
    const needs = a.needs ? `<div class="muted">needs: ${a.needs.map(esc).join(" | ")}</div>` : "";
    return `<div class="ans"><h3>${label(m)} ${j ? `<span class="chip ${verdict(j)}">${verdict(j)}</span>` : ""} ${tags.map(t => `<span class="tag">${esc(t)}</span>`).join(" ")}</h3>
      ${a.error ? `<div class="err">${esc(a.error)}</div>` : ""}<p>${esc(a.pred)}</p>${needs}${retrieved}
      ${j ? `<div class="judge">Judge: ${esc(j.thinking)}</div>` : ""}${unsupported}</div>`;
  });
  return `<tr class="detail"><td colspan="${methods.length + 2}"><div class="answers">
    <div class="ans"><h3>LFRQA reference <span class="tag">gold: ${q.gold.map(esc).join(", ")}</span></h3><p>${esc(q.reference)}</p></div>${blocks.join("")}</div></td></tr>`;
}

function questions(s, idx) {
  const qs = s.questions.filter(q => domainFilter === "all" || q.domain === domainFilter);
  return `<tr><th>Domain</th><th>Question</th>${idx.methods.map(m => `<th title="${esc(LABELS[m])}">${esc(LABELS[m].split(" ")[0])}</th>`).join("")}</tr>` +
    qs.map(q => `<tr class="q" tabindex="0" data-qid="${esc(q.qid)}"><td><span class="tag">${esc(q.domain)}</span></td><td>${esc(q.question)}</td>
      ${idx.methods.map(m => `<td>${cell(s, m, q, idx)}</td>`).join("")}</tr>${open.has(q.qid) ? detail(s, q, idx) : ""}`).join("");
}

function render() {
  const s = state, idx = index(s);
  $("run").textContent = s.run;
  $("phase").textContent = s.phase;
  const c = s.config;
  $("config").textContent = [c.answer_model && `answers ${c.answer_model}`, c.embedding_model && `embeddings ${c.embedding_model}`, c.navigation_model && `navigation ${c.navigation_model}`].filter(Boolean).join(" · ");
  $("stages").innerHTML = stages(s, idx);
  $("board").innerHTML = board(s, idx);
  $("domains").innerHTML = domains(s, idx);
  const ds = ["all", ...new Set(s.questions.map(q => q.domain))];
  $("filters").innerHTML = ds.map(d => `<button class="${d === domainFilter ? "on" : ""}" data-d="${esc(d)}">${esc(d)}</button>`).join("");
  $("questions").innerHTML = questions(s, idx);
  const log = $("log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.innerHTML = s.log.map(([t, m]) => `<span class="${/fail|error/i.test(m) ? "err" : ""}">${new Date(t * 1000).toLocaleTimeString()}  ${esc(m)}</span>`).join("\n");
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function tick() {
  if (!state) return;
  const age = Date.now() / 1000 - state.updated, active = !["done", "failed", "stopped"].includes(state.phase);
  $("dot").className = "dot" + (active && age < 15 ? " on" : "");
  $("ago").textContent = active ? `updated ${dur(Math.max(age, 0))} ago` + (age > 60 ? " (runner stopped?)" : "") : `finished ${new Date(state.updated * 1000).toLocaleString()}`;
}

async function poll() {
  try {
    const r = await fetch(`runs/${encodeURIComponent(run)}/state.json?t=${Date.now()}`, {cache: "no-store"});
    if (r.ok) {
      const s = await r.json();
      if (s.updated !== lastUpdated) { state = s; lastUpdated = s.updated; render(); }
    } else if (!state) $("phase").textContent = "waiting for runs/" + run + "/state.json";
  } catch (e) { /* state.json mid-write; next poll retries */ }
  tick();
}

$("questions").addEventListener("click", e => toggle(e.target.closest("tr.q")));
$("questions").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(e.target.closest("tr.q")); } });
function toggle(tr) { if (!tr) return; const id = tr.dataset.qid; open.has(id) ? open.delete(id) : open.add(id); render(); }
$("filters").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { domainFilter = b.dataset.d; render(); } });
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
