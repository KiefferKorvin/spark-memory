services:
  api:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: ["uvicorn", "graph_memory.api:create_app", "--factory", "--app-dir", "/app/src", "--host", "0.0.0.0", "--port", "8010", "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ./src:/app/src:ro
  ui:
    build:
      target: dev
    environment:
      MEMORY_API_PROXY: http://api:8010
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
